{% extends 'base.html' %}
{% block title %}Sign In – AI Smart Campus{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-75">
        <div class="col-md-8 col-lg-5">
            <div class="card card-glass shadow-lg border-0 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="login-brand-icon mx-auto mb-3">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <h3 class="fw-bold text-gradient mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your AI Smart Campus Intelligence account</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-bold">Roll Number or Campus Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted">
                                <i class="fa-solid fa-id-card"></i>
                            </span>
                            <input type="text" name="identifier" id="loginIdentifier" class="form-control border-start-0 ps-0" placeholder="e.g. CS2026001 or student@campus.ai" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label text-secondary small fw-bold mb-0">Password</label>
                            <a href="{{ url_for('reset_password') }}" class="small text-primary text-decoration-none">Forgot password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" name="password" id="loginPassword" class="form-control border-start-0 ps-0" placeholder="Enter your password" required>
                            <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePasswordVisibility('loginPassword')">
                                <i class="fa-regular fa-eye" id="loginPasswordEye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold shadow-sm">
                            <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to Portal
                        </button>
                    </div>
                </form>

                <!-- Quick Demo Login Switcher -->
                <div class="quick-demo-section mt-4 pt-3 border-top">
                    <div class="text-center text-muted small mb-2 fw-semibold">
                        <i class="fa-solid fa-bolt text-warning me-1"></i> Quick Demo Accounts
                    </div>
                    <div class="d-flex flex-wrap gap-2 justify-content-center">
                        <button type="button" class="btn btn-sm btn-outline-info rounded-pill" onclick="fillDemo('student@campus.ai', 'student123')">
                            <i class="fa-solid fa-user-graduate me-1"></i> Student
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-primary rounded-pill" onclick="fillDemo('faculty@campus.ai', 'faculty123')">
                            <i class="fa-solid fa-chalkboard-user me-1"></i> Faculty
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-dark rounded-pill" onclick="fillDemo('admin@campus.ai', 'admin123')">
                            <i class="fa-solid fa-shield-halved me-1"></i> Admin
                        </button>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <span class="text-muted small">New student or faculty member? </span>
                    <a href="{{ url_for('register') }}" class="small text-primary fw-bold text-decoration-none">Register Account</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillDemo(identifier, password) {
    document.getElementById('loginIdentifier').value = identifier;
    document.getElementById('loginPassword').value = password;
}

function togglePasswordVisibility(fieldId) {
    const input = document.getElementById(fieldId);
    const eye = document.getElementById(fieldId + 'Eye');
    if (input.type === 'password') {
        input.type = 'text';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
