{% extends 'base.html' %}
{% block title %}Reset Password – AI Smart Campus{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-75">
        <div class="col-md-7 col-lg-5">
            <div class="card card-glass shadow-lg border-0 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="login-brand-icon mx-auto mb-3">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <h3 class="fw-bold text-gradient mb-1">Reset Password</h3>
                    <p class="text-muted small">Enter your registered campus email to update your access password</p>
                </div>

                <form method="POST" action="{{ url_for('reset_password') }}">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-bold">Campus Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted">
                                <i class="fa-solid fa-envelope"></i>
                            </span>
                            <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="e.g. student@campus.ai" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-bold">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" name="new_password" class="form-control border-start-0 ps-0" placeholder="Enter new password" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-bold">Confirm New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted">
                                <i class="fa-solid fa-lock-open"></i>
                            </span>
                            <input type="password" name="confirm_password" class="form-control border-start-0 ps-0" placeholder="Re-enter new password" required>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold shadow-sm">
                            <i class="fa-solid fa-rotate-right me-2"></i> Update Password
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <a href="{{ url_for('login') }}" class="small text-primary fw-bold text-decoration-none">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
